<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>VERVAL CALON PENERIMA BLT</title>

    <!-- Favicon untuk browser modern -->
    <link rel="icon" type="image/png" href="assets/Bagde_Dinsos.png">
    <!-- Fallback atau cadangan (opsional) -->
    <link rel="shortcut icon" type="image/png" href="https://assets/Bagde_Dinsos.png">


  <style>
    /* Reset agar iframe benar-benar memenuhi viewport */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      min-height: 100dvh;
    }

    .iframe-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    #suketFrame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* Fallback untuk browser lama yang belum mendukung dvh */
    @supports not (height: 100dvh) {
      .iframe-wrapper {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <main class="iframe-wrapper">
    <iframe
      id="suketFrame"
      src="https://script.google.com/macros/s/AKfycbwLsP2IB7ud9y0SRoknA0ECuYtdEHGxXsapo5lTHNrxjPFLPvDsnEIvk9W7DA1Ct7HDQg/exec"
